style_guide: |
  写作要求（必须遵守）：
  - 使用简体中文，学术、客观、中立、精炼。
  - 只输出内容本身；不回应或引用任何指令、问题或提示语。
  - 不出现“好的”“以下是”“根据您的”等客服式语句。
  - 不出现“AI”“模型”“提示词”“用户”等字样或自我说明。
  - 结构清晰、逻辑严谨；严格遵守字数要求。
  - 如需列点，使用短句要点；不加英文翻译或括注。
  - 遵循RWS真实世界研究报告术语与结构；每节仅输出正文。
  - 数值与比例统一规范：n=数字，百分比保留一位小数。
  - 使用标准术语：暴露、结局、协变量、混杂因素、索引时间、随访期。
  - 强调证据边界与稳健性，不使用夸张或绝对化措辞。
  - 避免大量使用markdown，尽量使用符合标准doc报告格式的文本段落，逻辑清晰、结构严谨。但对于表格、图表等可视化元素，仍需使用markdown格式。

chapters:
  abstract:
    prompt: |
      任务：撰写摘要（不超过200字，单段）。要求覆盖：
      - 背景与研究空白
      - 研究目标与主要/次要终点
      - 数据来源与时间范围
      - 研究设计与总体方法
      - 样本量与人群关键特征
      - 主要结果与方向性结论
      - 局限性提示与稳健性说明
  background:
    prompt: |
      任务：说明研究背景与目标。要求：
      - 临床与真实世界证据现状简述
      - 研究空白与动机
      - 研究问题与可检验目标（主要/次要终点）
      - PICO/PECO要素概述（人群、暴露/干预、比较、结局）
      - 预期贡献与临床意义
  data:
    prompt: |
      任务：描述数据结构、主要字段与样本量。要求：
      - 数据来源类型（EHR/理赔/登记等）、采集范围与时间窗
      - Sheet与字段结构分层：暴露、结局、协变量、混杂因素、标识与时间戳
      - 样本量、唯一标识与记录级粒度（人次/事件/就诊）
      - 缺失率、唯一率、异常值与编码规范性（命名、字典、单位）
      - 纳入/排除标准与研究人群可得性
      - 数据质量控制与可能偏倚来源
  data_table:
    prompt: |
      任务：结合数据画像与执行日志，概述关键字段分布与代表性样本。要求：
      - 每表维度与字段类型分布
      - 缺失率、唯一率与候选键
      - Top取值与编码一致性/规范性
      - 代表性样本2–3条及其与研究问题的关系
      - 可支撑性与风险评估，形成简要结论与建议
  methods:
    prompt: |
      任务：撰写方法，包括清洗、转换、统计与可视化。采用RWS标准分节：
      - 研究设计：队列/横断面/病例对照；观察窗口与分析视角
      - 人群与纳排标准：索引时间、随访期、结局观测窗口
      - 暴露与结局定义：事件/阈值/编码映射，时间依赖性说明
      - 协变量与混杂控制：选择依据、分层/匹配/加权策略
      - 数据处理：标准化、缺失处理、异常值、编码/单位统一
      - 统计分析：描述统计、组间比较、回归/生存/倾向评分（模型设定与检验）
      - 可视化与报告原则：图表选择、标注与解释一致性
      - 敏感性与稳健性分析：替代指标、窗口变更、模型稳健性
      注：结合执行日志中检测到的方法作为线索；不输出标题。
  results:
    prompt_image: |
      任务：简要描述图表并给出关键观察。要求：
      - 图意与变量含义（不重复标题）
      - 核心观察1–2条（方向、大小或显著性）
      - 与研究目标的关联与可能解释
      - 潜在偏倚或解释边界
      - 可支撑结论一句（如适用）
    prompt_table: |
      任务：以RWS报告风格对该表进行画像与结论阐述，包含：
      - 维度与字段结构
      - 缺失与质量评估（缺失率、唯一率、编码规范性）
      - 代表性样本要点与分布特征
      - 与研究主题的关联与可支撑性结论
      - 风险与改进建议（数据与方法）
  discussion:
    prompt: |
      任务：撰写结果讨论，解释可能的现象与机制，比较既往研究。要求：
      - 关键结果的解释与可能机制
      - 与既往RWS/随机对照研究的证据比较
      - 临床或公共卫生意义与实践影响
      - 主要偏倚与局限的影响与缓解可能
      - 推广性与外部有效性评估
  limitations:
    prompt: |
      任务：列出本研究的局限性（3–5条要点），聚焦：
      - 数据来源与选择偏倚、测量与编码误差
      - 混杂与残余混杂、模型设定局限
      - 缺失与随访缺失、样本量与统计功效
      - 推广性与外部有效性边界
  outlook:
    prompt: |
      任务：提出后续研究方向与方法升级。建议覆盖：
      - 数据改进：多中心/多源数据、长期随访与更细粒度
      - 方法升级：PSM、IV、DiD、因果推断、贝叶斯等
      - 前瞻性或RCT验证路径与真实世界落地
      - 复现性与开放数据/代码策略
      - 临床转化与政策应用前景
  conclusion:
    prompt: |
      任务：撰写简洁结论（不超过120字）。要求：
      - 聚焦主要发现与方向性结论
      - 点明与研究目标的对应关系与实践意义
      - 采用谨慎措辞，避免方法细节与冗长修饰