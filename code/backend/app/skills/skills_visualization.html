
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>AI4Research Skills 能力全景图</title>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #f8f9fa;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            #main {
                width: 100vw;
                height: 100vh;
            }
            .header {
                position: absolute;
                top: 20px;
                left: 30px;
                z-index: 10;
            }
            .header h1 {
                font-size: 28px;
                color: #2c3e50;
                margin: 0;
            }
            .header p {
                font-size: 14px;
                color: #7f8c8d;
                margin-top: 5px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>AI4Research Skills 全景能力图谱</h1>
            <p>展示各个核心阶段所包含的专属技能模块</p>
        </div>
        <div id="main"></div>
        <script>
            var chartDom = document.getElementById('main');
            var myChart = echarts.init(chartDom);
            
            const graphData = {"name": "\ud83c\udf1f AI4Research Skills", "children": [{"name": "\ud83d\udcca \u6570\u636e\u4e0e\u7814\u7a76\u89c4\u5212\n(Data & Planning)", "children": [{"name": "data_profiling"}, {"name": "research_planning"}, {"name": "research_planning_refined"}, {"name": "sandbox_research"}]}, {"name": "\ud83d\udcbb \u4ee3\u7801\u4e0e\u6267\u884c\n(Code & Execution)", "children": [{"name": "code_generation"}, {"name": "code_repair"}]}, {"name": "\ud83d\udcdd \u62a5\u544a\u751f\u6210\n(Reporting)", "children": [{"name": "report_generation"}]}, {"name": "\ud83e\udd16 Copilot\u4e0e\u7cfb\u7edf\u8f85\u52a9\n(Copilot & System)", "children": [{"name": "copilot_domain_knowledge"}, {"name": "copilot_page_understanding"}, {"name": "copilot_system_info"}, {"name": "copilot_system_operations"}, {"name": "frontend_navigation"}]}]};

            var option = {
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove'
                },
                series: [
                    {
                        type: 'tree',
                        data: [graphData],
                        top: '10%',
                        left: '15%',
                        bottom: '10%',
                        right: '20%',
                        symbolSize: 12,
                        label: {
                            position: 'left',
                            verticalAlign: 'middle',
                            align: 'right',
                            fontSize: 16,
                            fontWeight: 'bold',
                            color: '#34495e',
                            backgroundColor: '#fff',
                            borderColor: '#3498db',
                            borderWidth: 1,
                            borderRadius: 6,
                            padding: [8, 12]
                        },
                        leaves: {
                            label: {
                                position: 'right',
                                verticalAlign: 'middle',
                                align: 'left',
                                fontSize: 14,
                                fontWeight: 'normal',
                                color: '#2c3e50',
                                backgroundColor: '#ecf0f1',
                                borderColor: '#bdc3c7',
                                borderWidth: 1,
                                borderRadius: 4,
                                padding: [6, 10],
                                shadowColor: 'rgba(0, 0, 0, 0.1)',
                                shadowBlur: 3
                            }
                        },
                        emphasis: {
                            focus: 'descendant'
                        },
                        expandAndCollapse: true,
                        animationDuration: 550,
                        animationDurationUpdate: 750,
                        initialTreeDepth: 2,
                        lineStyle: {
                            color: '#bdc3c7',
                            width: 2,
                            curveness: 0.5
                        }
                    }
                ]
            };

            option && myChart.setOption(option);
            
            // Auto resize
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        </script>
    </body>
    </html>
